name: CI

# Lint, type-check, test (including the real-PostgreSQL integration specs, which run on PGlite in memory,
# so no database service or secret is needed) and build both workspaces. Deployment is done by Vercel's
# GitHub integration, not by this workflow.

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Backend tests (mocked + real PostgreSQL via PGlite)
        run: npm test
      - name: End-to-end smoke test of the Vercel function entry on PostgreSQL
        run: npm run e2e:local
